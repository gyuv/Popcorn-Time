name: Build all platforms

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy-web:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: popcorn-time-windows, path: 'release/*.exe' }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: popcorn-time-mac-universal, path: 'release/*.dmg' }

  android:
    # One APK serves both phones/tablets and Android TV (leanback launcher enabled).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx vite build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk popcorn-time-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: popcorn-time-android-apk, path: popcorn-time-android.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with: { files: 'out/**/*' }
